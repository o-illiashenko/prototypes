:root{
  color-scheme:light;
  /* text */
  --text-primary:#2e384d; --text-muted:#6b7280; --text-secondary:#818794; --text-placeholder:#abafb7;
  --text-link:#0a41fa; --text-action:#0a41fa; --text-on-action:#ffffff; --text-strong:#0f131a; --text-disabled:#51596a;
  /* surfaces */
  --surface-background:#f7f8fc; --surface-default:#ffffff; --surface-nav:#d4ebeb; --surface-disabled:#e9eaed;
  --surface-tooltip:#2e384d; --surface-scrim:#2e384d4d;
  --surface-info-rest:#f2f5ff; --surface-info-hover:#e6ebff; --surface-info-highlight:#ced9fe; --surface-info-active:#0a41fa;
  --surface-neutral-active:#abafb7;
  --surface-warning-rest:#fffcf5; --surface-warning-highlight:#fef3d7; --surface-warning-active:#f7c137;
  --surface-success-rest:#f4fbf4; --surface-success-highlight:#d6eed5; --surface-success-active:#33ac2e;
  --surface-error-rest:#fef4f5; --surface-error-active:#e83645;
  /* borders */
  --border-primary:#818794; --border-secondary:#abafb7; --border-muted:#d5d7db; --border-faint:#e9eaed;
  --border-focus:#6c8dfc; --border-active:#0a41fa; --border-hover:#9db3fd; --border-warning:#f7c137;
  --border-error:#ec5e6a; --border-success:#5bbc57;
  /* actions */
  --action-primary-rest:#0a41fa; --action-primary-hover:#0834c7; --action-secondary-rest:#e6ebff;
  --action-secondary-hover:#ced9fe; --action-tertiary-hover:#ced9fe; --action-arrow:#0834c7;
  /* attachment viewer */
  --pdf-surface:#2e384d; --pdf-ink:#f4f5f6; --pdf-hover:#46506a;
  --paper:#ffffff; --paper-ink:#2e384d; --paper-muted:#6b7280; --paper-rule:#d5d7db; --paper-rule-strong:#9d9d9d;
  --icon-strong:#0f131a;
  --overflow-shadow:rgba(14,25,180,.15);   /* Atlas: only for content scrolling under a pinned column */
  /* Vinterlys Kraft brand, only used inside the electricity invoice attachment */
  --el-brand:#1d3b5c; --el-accent:#f5b83d; --el-tint:#eef3f8; --el-bar:#a9bbd0;
  /* shape + type */
  --radius:4px; --radius-full:9999px;
  --font:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --side-w:260px; --side-mini:64px; --top-h:50px; --demo-h:40px;
}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--surface-background);color:var(--text-primary);font:400 14px/1.4 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
.c-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{display:block;flex:0 0 auto}
.i16{width:16px;height:16px}.i20{width:20px;height:20px}.i24{width:24px;height:24px}.i34{width:34px;height:34px}
.num{font-variant-numeric:tabular-nums}

/* ---------------- shell ---------------- */
.c-app{height:100%;display:flex;flex-direction:column;min-width:0;overflow:hidden;overflow:clip}
.c-topbar{flex:0 0 var(--top-h);height:var(--top-h);background:var(--surface-nav);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:5px 16px;position:relative;z-index:40}
.c-topbar__left,.c-topbar__right{display:flex;align-items:center;gap:24px;min-width:0}
.c-topbar__burger,.c-topbar__icon{width:32px;height:32px;margin:-4px;display:grid;place-items:center;border-radius:var(--radius)}
.c-topbar__burger:hover,.c-topbar__icon:hover{background:var(--surface-default)}
.c-topbar__logo{display:block;line-height:0;border-radius:var(--radius)}
.c-search{display:flex;align-items:center;gap:8px;width:342px;height:40px;padding:0 10px;background:var(--surface-default);border:1px solid var(--border-secondary);border-radius:var(--radius)}
.c-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14px;line-height:1.5}
.c-search input::placeholder{color:var(--text-secondary)}
.c-search:focus-within{border-color:var(--border-active)}
.c-search__btn{display:none}
.c-page{flex:1 1 auto;min-height:0;display:flex;position:relative}

/* side menu */
.c-side{flex:0 0 var(--side-w);width:var(--side-w);background:var(--surface-background);border-right:1px solid var(--border-muted);padding:11px 8px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;transition:flex-basis .2s ease,width .2s ease}
.c-side__item{display:flex;align-items:center;gap:12px;height:40px;padding:3px 4px;border-radius:var(--radius);font-size:15px;line-height:1.2;color:var(--text-primary);white-space:nowrap;width:100%}
.c-side__item:hover{background:var(--surface-info-hover)}
.c-app.is-side-mini .c-side{flex-basis:var(--side-mini);width:var(--side-mini)}
.c-app.is-side-mini .c-side__label{display:none}
.c-side-scrim{display:none}

/* middle column */
.c-middle{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;display:flex;flex-direction:column}
.c-middle__inner{padding:12px 24px 32px;display:flex;flex-direction:column;gap:24px;min-width:0}
.c-stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* page header */
.c-ph{display:flex;flex-direction:column;gap:12px}
.c-ph__crumbs{height:40px;display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.4;white-space:nowrap}
.c-ph__crumbs a{color:var(--text-link);text-decoration:none}
.c-ph__crumbs a:hover{text-decoration:underline}
.c-ph__title{display:flex;align-items:center;gap:24px;min-height:48px;flex-wrap:wrap;row-gap:4px}
.c-ph__title h1{font-size:30px;line-height:1.3;font-weight:500;text-wrap:balance}
.c-saved{display:flex;align-items:center;gap:4px;font-size:14px;line-height:1.4}
.c-ph__sub{display:flex;align-items:center;gap:16px;min-height:24px;flex-wrap:wrap;row-gap:4px}
.c-status{display:flex;align-items:center;gap:8px;color:var(--text-muted);white-space:nowrap}
.c-status__dot{width:10px;height:10px;border-radius:var(--radius-full);background:var(--surface-warning-active)}
.c-linkbtn{color:var(--text-link);padding:0 8px;border-radius:var(--radius);line-height:1.4}
.c-linkbtn:hover{text-decoration:underline}

/* cards */
.c-card{background:var(--surface-default);border:1px solid var(--border-muted);border-radius:var(--radius);min-width:0}
.c-details{padding:16px 24px;display:flex;flex-direction:column;gap:8px}
.c-details__head{display:flex;align-items:center;gap:8px;height:40px;width:100%}
.c-details__supplier{flex:1;min-width:0;font-size:16px;line-height:1.3;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-details__amount{font-size:16px;line-height:1.3;font-weight:500;white-space:nowrap}
.c-details__chev{width:20px;height:20px;display:grid;place-items:center;transition:transform .15s}
.c-details__chev svg{width:24px;height:24px;flex:0 0 auto}
.c-details.is-collapsed .c-details__chev{transform:rotate(180deg)}
.c-details.is-collapsed .c-details__fields{display:none}
.c-details__fields{display:flex;flex-wrap:wrap;gap:16px}
.c-kv{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:4px}
.c-kv__k{color:var(--text-muted);line-height:1.4}
.c-kv__v{line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------------- Kostnader card ---------------- */
.c-costs{padding:12px 0 24px;display:flex;flex-direction:column;gap:16px}
.c-costs__body{display:flex;flex-direction:column;gap:16px;min-width:0}
.c-pad{padding-inline:24px}
.c-costs__head{display:flex;align-items:center;gap:24px;min-height:32px;flex-wrap:wrap;row-gap:8px}
.c-costs__title{flex:1 1 auto;font-size:16px;line-height:1.3;font-weight:500}
.c-toggle{display:inline-flex;align-items:center;gap:8px;line-height:1.4;white-space:nowrap;border-radius:var(--radius)}
.c-toggle__pill{position:relative;width:36px;height:18px;border-radius:var(--radius-full);background:var(--surface-neutral-active);flex:0 0 auto;transition:background .15s}
.c-toggle__pill::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:var(--radius-full);background:var(--surface-default);transition:left .15s}
.c-toggle[aria-checked="true"] .c-toggle__pill{background:var(--surface-info-active)}
.c-toggle[aria-checked="true"] .c-toggle__pill::after{left:21px}
.c-iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--radius);color:var(--text-primary);flex:0 0 auto}
.c-iconbtn:hover{background:var(--action-tertiary-hover)}
.c-iconbtn--sm{width:32px;height:32px}
.c-iconbtn[aria-expanded="true"]{background:var(--action-tertiary-hover)}

/* tabs */
.c-tabs{display:flex;gap:12px;height:40px;margin-block:-14px -2px;align-items:flex-start}
.c-tab{height:40px;padding:3px 2px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:2px;line-height:1.4;white-space:nowrap;border-radius:var(--radius) var(--radius) 0 0}
.c-tab::after{content:"";display:block;height:4px;border-radius:2px;background:var(--action-secondary-rest)}
.c-tab[aria-selected="true"]::after{background:var(--action-primary-rest)}
.c-tab:hover::after{background:var(--action-secondary-hover)}
.c-tab[aria-selected="true"]:hover::after{background:var(--action-primary-rest)}

/* buttons */
.c-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--radius);font-size:14px;line-height:1.4;white-space:nowrap;flex:0 0 auto}
.c-btn--sm{height:32px}
.c-btn--primary{background:var(--action-primary-rest);color:var(--text-on-action)}
.c-btn--primary:hover{background:var(--action-primary-hover)}
.c-btn--secondary{background:var(--action-secondary-rest);color:var(--text-action)}
.c-btn--secondary:hover{background:var(--action-secondary-hover)}
.c-btn--tertiary{background:transparent;color:var(--text-action)}
.c-btn--tertiary:hover{background:var(--action-tertiary-hover)}


/* cost sections */
.c-costlist{display:flex;flex-direction:column;gap:16px}
.c-cost{display:flex;flex-direction:column;gap:16px}
.c-cost.is-new{animation:c-flash 1.6s ease-out}
@keyframes c-flash{0%{background:var(--surface-info-hover)}100%{background:transparent}}
.c-cost__head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;flex-wrap:wrap}
.c-cost__title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.c-cost__name{font-weight:500;line-height:1.4;white-space:nowrap}
.c-cost__actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.c-chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding-right:8px;border-radius:var(--radius-full);background:var(--surface-background);border:1px solid var(--border-muted);line-height:1.4;white-space:nowrap}
.c-chip__ico{width:24px;height:22px;display:grid;place-items:center}
.c-chip:hover{background:var(--surface-info-hover);border-color:var(--surface-info-highlight)}
.c-label{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-full);background:var(--surface-info-highlight);line-height:1.4;white-space:nowrap;font-size:14px}
.c-divider{height:1px;background:var(--border-muted);margin-inline:24px}
.c-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.c-fields--wide{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.c-ig{display:flex;flex-direction:column;gap:8px;min-width:0}
.c-ig__label{line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-field{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px 0 16px;background:var(--surface-background);border:1px solid var(--border-primary);border-radius:var(--radius);line-height:1.4;min-width:0;text-align:left}
.c-field--lg{height:40px}
.c-field:hover{border-color:var(--border-hover)}
.c-field:focus-within{border-color:var(--border-active)}
.c-field input{flex:1;min-width:0;width:100%;height:100%;border:0;padding:0;background:transparent;outline:0;line-height:1.4;text-overflow:ellipsis}
.c-field input::placeholder{color:var(--text-placeholder)}
.c-field__val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-field__val.is-empty{color:var(--text-placeholder)}
.c-field.is-error,.c-field.is-error:hover{border-color:var(--border-error)}
.c-field.is-readonly{cursor:default}
.c-field.is-readonly:hover{border-color:var(--border-primary)}
.c-field--right input{text-align:right}
.c-field svg{color:var(--text-primary)}

/* footer + totals */
.c-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.c-totals{display:flex;justify-content:space-between;gap:11px;width:382px;max-width:100%;text-align:right}
.c-totals__col{flex:0 1 120px;min-width:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.4}
.c-totals__col b{font-weight:500;white-space:nowrap}
.c-alert{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:12px;border:1px solid var(--border-warning);background:var(--surface-warning-rest);border-radius:var(--radius);line-height:1.4}
.c-alert svg{color:var(--text-primary);margin-top:-1px}
.c-alert b{font-weight:500}
.c-empty{padding:32px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:var(--text-muted)}
.c-empty strong{color:var(--text-primary);font-weight:500;font-size:16px}

/* ---------------- Ordrelinjer table ---------------- */
.c-tf{display:flex;align-items:center;gap:8px;min-height:64px;padding:12px;border-block:1px solid var(--border-muted);background:var(--surface-default);flex-wrap:wrap}
.c-tf__search{display:flex;align-items:center;gap:8px;width:200px;height:40px;padding:0 10px 0 16px;background:var(--surface-background);border:1px solid var(--border-primary);border-radius:var(--radius)}
.c-tf__search:hover{border-color:var(--border-hover)}
.c-tf__search:focus-within{border-color:var(--border-active)}
.c-tf__search input{flex:1;min-width:0;border:0;background:transparent;outline:0;line-height:1.4}
.c-tf__search input::placeholder{color:var(--text-placeholder)}
.c-tf__search svg{color:var(--text-primary)}
.c-tf__quick{flex:1 1 auto;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.c-qchip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 12px;border-radius:var(--radius-full);background:var(--surface-info-highlight);white-space:nowrap}
.c-qchip button{width:24px;height:24px;display:grid;place-items:center;border-radius:var(--radius-full)}
.c-qchip button:hover{background:var(--surface-default)}
.c-qchip svg{color:var(--text-primary)}
.c-bulk{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px;border-block:1px solid var(--border-muted);background:var(--surface-info-rest);flex-wrap:wrap}
.c-bulk__count{flex:1 1 auto;line-height:1.4}
.c-bulk__actions{display:flex;gap:12px;flex-wrap:wrap}
.c-lines{display:flex;flex-direction:column;min-width:0}
.c-tablewrap{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.c-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.c-table th{height:48px;padding:0 22px;background:var(--surface-info-rest);border-bottom:1px solid var(--border-muted);font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.c-table th.r{text-align:right}
.c-table th.c-th-sel,.c-table td.c-td-sel{padding:0 0 0 12px}
.c-table th.c-th-act{padding:0}
.c-sortbtn{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-weight:500;border-radius:var(--radius);white-space:nowrap}
.c-sortbtn span{overflow:hidden;text-overflow:ellipsis}
.c-sortbtn svg{width:16px;height:16px;color:var(--text-primary);flex:0 0 auto}
.c-sortbtn:hover span{text-decoration:underline}
.c-table td{height:47px;padding:0 6px;border-bottom:1px solid var(--border-muted);background:var(--surface-default);vertical-align:middle;white-space:nowrap}
.c-table tr.is-selected td,.c-table tbody tr:hover td,.c-table tbody tr:focus-within td{background:var(--surface-info-rest)}
.c-cf{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 16px;border:1px solid transparent;border-radius:var(--radius);background:transparent;line-height:1.5;min-width:0;text-align:left}
.c-cf input{flex:1;min-width:0;width:100%;height:100%;border:0;padding:0;background:transparent;outline:0;line-height:1.5;text-overflow:ellipsis}
.c-cf input::placeholder{color:var(--text-placeholder)}
.c-cf--select{padding:0 10px 0 16px}
.c-cf--select svg{color:var(--text-primary);visibility:hidden}
.c-cf--amount{padding:0 16px 0 10px}
.c-cf--amount .c-cf__cur{flex:0 0 auto}
.c-cf--amount input,.c-cf--right input{text-align:right}
.c-cf__val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-cf__val.is-empty{color:var(--text-placeholder)}
.c-cf.is-static{border-color:transparent!important;background:transparent!important}
tbody tr:hover .c-cf:not(.is-static),tbody tr:focus-within .c-cf:not(.is-static){background:var(--surface-background);border-color:var(--border-primary)}
tbody tr:hover .c-cf--select svg,tbody tr:focus-within .c-cf--select svg{visibility:visible}
tbody tr .c-cf:not(.is-static):focus-within,tbody tr .c-cf--select:focus-visible{border-color:var(--border-active);outline:0}
.c-cf.is-disabled{color:var(--text-placeholder)}
tbody tr:hover .c-cf.is-disabled,tbody tr:focus-within .c-cf.is-disabled{background:var(--surface-disabled);border-color:var(--border-secondary)}
.c-rebill{display:flex;align-items:center;gap:8px;padding-left:6px}
.c-rebill .c-cf{padding:0 10px 0 12px;justify-content:flex-end}
.c-td-act{padding:0 12px 0 0!important}
.c-rowacts{display:flex;justify-content:flex-end;gap:4px}
.c-rowacts .c-iconbtn svg{color:var(--text-primary)}

/* checkbox */
.c-check{appearance:none;-webkit-appearance:none;margin:1px;width:18px;height:18px;border:1px solid var(--border-primary);border-radius:2px;background:var(--surface-background);display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto;vertical-align:middle}
.c-check:hover{border-color:var(--border-hover)}
.c-check:checked,.c-check:indeterminate{background:var(--action-primary-rest);border-color:var(--action-primary-rest)}
.c-check:checked::after{content:"";width:10px;height:6px;border-left:2px solid var(--text-on-action);border-bottom:2px solid var(--text-on-action);transform:translateY(-1px) rotate(-45deg)}
.c-check:indeterminate::after{content:"";width:10px;height:2px;background:var(--text-on-action)}

/* ---------------- payment ---------------- */
.c-pay{border-color:var(--border-secondary);padding:24px 32px;display:flex;flex-direction:column;gap:24px}
.c-pay__head{display:flex;align-items:center;gap:12px}
.c-pay__head .c-toggle{gap:12px;font-size:16px;line-height:1.3;font-weight:500}
.c-pay__form{display:flex;flex-direction:column;gap:12px}
.c-pay__row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.c-pay__row .c-ig__label.r{text-align:right}
.c-pay.is-off .c-pay__form{display:none}
.c-radios{display:flex;gap:24px;height:40px;align-items:center}
.c-radio{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.c-radio input{appearance:none;-webkit-appearance:none;margin:1px;width:18px;height:18px;border:1px solid var(--border-primary);border-radius:var(--radius-full);background:var(--surface-background);display:inline-grid;place-items:center;cursor:pointer}
.c-radio input:checked{border-color:var(--border-active)}
.c-radio input:checked::after{content:"";width:10px;height:10px;border-radius:var(--radius-full);background:var(--border-active)}
.c-datebtn{width:32px;height:32px;margin-right:-6px;display:grid;place-items:center;border-radius:var(--radius)}
.c-datebtn:hover{background:var(--action-tertiary-hover)}

/* ---------------- attachment panel ---------------- */
.c-pdf{flex:0 0 auto;width:clamp(380px,35.4vw,760px);position:relative;background:var(--pdf-surface);display:flex;flex-direction:column;min-height:0;transition:width .2s ease}
.c-pdf__viewer{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.c-pdf__bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 24px;background:var(--pdf-surface);flex:0 0 auto}
.c-pdf__grp{display:flex;align-items:center;gap:4px}
.c-pdf__grp span{color:var(--pdf-ink);line-height:1.5;white-space:nowrap}
.c-pdfbtn{width:32px;height:32px;border-radius:var(--radius);display:grid;place-items:center;color:var(--pdf-ink)}
.c-pdfbtn:hover{background:var(--pdf-hover)}
.c-pdfbtn svg{color:var(--pdf-ink)}
.c-pdf__scroll{flex:1 1 auto;overflow:auto;scrollbar-gutter:stable;padding:16px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.c-pagebox{position:relative;flex:0 0 auto}
.c-paper{position:absolute;left:0;top:0;width:595px;height:842px;background:var(--paper);color:var(--paper-ink);transform-origin:0 0;padding:42px 46px 36px;display:flex;flex-direction:column;font-size:9px;line-height:1.35;overflow:hidden}
.c-tabhandle{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;display:flex;align-items:center;gap:8px;width:40px;padding:12px 0;background:var(--action-secondary-rest);color:var(--text-action);line-height:1.5;z-index:5;white-space:nowrap}
.c-tabhandle:hover{background:var(--action-secondary-hover)}
.c-tabhandle svg{color:var(--action-arrow)}
.c-tabhandle--hide{left:1px;border-radius:0 var(--radius) var(--radius) 0}
.c-tabhandle--show{right:0;border-radius:var(--radius) 0 0 var(--radius)}
.c-app.is-pdf-closed .c-pdf{width:40px;background:transparent}
.c-app.is-pdf-closed .c-pdf__viewer,.c-app.is-pdf-closed .c-tabhandle--hide{display:none}
.c-app:not(.is-pdf-closed) .c-tabhandle--show{display:none}

/* paper (mock invoice) */
.c-inv__top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.c-inv__brand{display:flex;flex-direction:column;gap:4px;width:150px}
.c-inv__brand img{width:72px;height:72px}
.c-inv__brand b{font-size:11px;font-weight:500}
.c-inv__cols{display:flex;gap:24px;color:var(--paper-muted)}
.c-inv__cols div{display:flex;flex-direction:column;gap:2px}
.c-inv__mid{display:flex;justify-content:space-between;gap:24px;margin-top:40px}
.c-inv__buyer{display:flex;flex-direction:column;gap:2px;width:150px}
.c-inv__buyer b{font-weight:500}
.c-inv__meta{flex:1;max-width:250px;display:flex;flex-direction:column;gap:10px}
.c-inv__meta h3{font-size:20px;line-height:1.3;font-weight:500}
.c-inv__meta dl{display:grid;grid-template-columns:auto auto;gap:3px 16px;margin:0}
.c-inv__meta dt{color:var(--paper-muted)}
.c-inv__meta dd{margin:0;text-align:right}
.c-inv__lines{width:100%;border-collapse:collapse;margin-top:28px;table-layout:fixed}
.c-inv__lines th{font-weight:500;text-align:left;padding:5px 0;border-top:1px solid var(--paper-rule-strong);border-bottom:1px solid var(--paper-rule-strong)}
.c-inv__lines td{padding:3.5px 0;border-bottom:1px solid var(--paper-rule)}
.c-inv__lines .r{text-align:right}
.c-inv__sum{align-self:flex-end;width:250px;margin-top:20px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;border-top:1px solid var(--paper-rule-strong);padding-top:8px}
.c-inv__sum .r{text-align:right}
.c-inv__sum .tot{font-weight:500;font-size:11px;border-top:1px solid var(--paper-rule-strong);padding-top:6px;margin-top:2px}
.c-inv__foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--paper-rule);display:flex;justify-content:space-between;gap:16px;color:var(--paper-muted)}

/* ---------------- popovers, modal, toast ---------------- */
.c-pop{position:fixed;z-index:1000;background:var(--surface-background);border:1px solid var(--border-primary);border-radius:var(--radius);padding:4px;display:flex;flex-direction:column;gap:4px;max-height:420px}
.c-pop[hidden]{display:none}
.c-pop__search{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 16px;border:1px solid var(--border-active);border-radius:var(--radius);background:var(--surface-background);flex:0 0 auto}
.c-pop__search input{flex:1;min-width:0;border:0;background:transparent;outline:0}
.c-pop__search svg{color:var(--text-secondary)}
.c-pop__list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.c-opt{display:flex;align-items:center;gap:16px;min-height:48px;padding:6px 12px;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;line-height:1.4}
.c-opt__num{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums}
.c-opt__text{flex:1;min-width:0;display:flex;flex-direction:column}
.c-opt__desc{font-size:12px;line-height:1.4;color:var(--text-muted);white-space:normal}
.c-opt.is-active{border-color:var(--border-hover)}
.c-opt[aria-selected="true"]{background:var(--surface-info-hover)}
.c-opt.is-muted{color:var(--text-muted)}
.c-pop__foot{display:flex;justify-content:flex-end;border-top:1px solid var(--border-muted);padding:8px 8px 4px}
.c-pop__foot 
.c-pop__empty{padding:12px;color:var(--text-muted)}
.c-menu{min-width:280px;padding:12px;gap:12px}
.c-menu h3{font-size:14px;font-weight:500;line-height:1.4}
.c-menu p{font-size:12px;color:var(--text-muted);line-height:1.4}
.c-menu__list{display:flex;flex-direction:column;gap:4px}
.c-menu__row{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 4px;border-radius:var(--radius);cursor:pointer}
.c-menu__row:hover{background:var(--surface-info-hover)}
.c-menu__row small{margin-left:auto;color:var(--text-muted);font-size:12px}
.c-scrim{position:fixed;inset:0;background:var(--surface-scrim);display:grid;place-items:center;z-index:900;padding:16px}
.c-scrim[hidden]{display:none}
.c-modal{background:var(--surface-default);border-radius:var(--radius);width:min(520px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.c-modal__head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 16px 16px 24px;border-bottom:1px solid var(--border-muted)}
.c-modal__head h2{font-size:20px;line-height:1.3;font-weight:500}
.c-modal__body{padding:24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.c-modal__foot{display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--border-muted);flex-wrap:wrap}
.c-modal__foot .c-btn--tertiary{margin-left:auto}
.c-modal .c-fields{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
/* variant B: order lines dialog, sits under the edit modal and the dropdowns */
.c-scrim--lines{z-index:800}
.c-ldlg{width:min(1240px,100%);height:min(880px,calc(100% - 32px));max-height:none}
.c-ldlg__body [data-diff]{padding-bottom:16px}
.c-ldlg__title{display:flex;flex-direction:column;gap:2px;min-width:0}
.c-ldlg__title span{color:var(--text-muted);line-height:1.4}
.c-ldlg__body{flex:1 1 auto;min-height:0;overflow:auto}
.c-ldlg__body .c-tf,.c-ldlg__body .c-bulk{border-top:0}
.c-ldlg__body .c-foot{padding-block:16px}
.c-ldlg__foot{align-items:center;gap:16px}
.c-ldlg__sum{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;min-width:0;color:var(--text-muted);line-height:1.4}
.c-ldlg__sum b{color:var(--text-primary);font-weight:500}
.c-note{padding:12px;border:1px solid var(--border-focus);background:var(--surface-info-rest);border-radius:var(--radius);line-height:1.4}
.c-toasts{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:1100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.c-toast{pointer-events:auto;display:flex;align-items:center;gap:16px;min-height:40px;max-width:min(480px,calc(100vw - 32px));padding:8px 8px 8px 16px;background:var(--surface-tooltip);color:var(--pdf-ink);border-radius:var(--radius);line-height:1.4}
.c-toast button{color:var(--surface-info-highlight);padding:0 8px;height:32px;border-radius:var(--radius);white-space:nowrap}
.c-toast button:hover{background:var(--pdf-hover)}

/* ---------------- responsive ---------------- */
/* ---------------- demo strip: prototype navigation only, deliberately outside the Tripletex shell ---------------- */
.c-demo{flex:0 0 var(--demo-h);height:var(--demo-h);display:flex;align-items:center;gap:12px;padding:4px 16px;background:var(--surface-tooltip);color:var(--pdf-ink);overflow-x:auto;overflow-y:hidden}
.c-demo__sep{flex:0 0 1px;align-self:stretch;margin-block:4px;background:var(--pdf-hover)}
.c-demo__label{font-size:12px;line-height:1.4;font-weight:500;white-space:nowrap}
.c-demo__hint{font-weight:400}
.c-demo__list{display:flex;gap:8px}
.c-demo__btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 4px;border-radius:var(--radius);color:var(--pdf-ink);white-space:nowrap;line-height:1.4}
.c-demo__btn:hover{background:var(--pdf-hover)}
.c-demo__btn.is-on{background:var(--surface-default);color:var(--text-primary)}
.c-demo__no{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--radius-full);background:var(--pdf-hover);font-size:12px;font-weight:500}
.c-demo__btn.is-on .c-demo__no{background:var(--surface-info-highlight)}
.c-demo__done{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.c-demo__done svg{color:var(--surface-success-active)}

/* ---------------- Bokfør bar + posted state ---------------- */
.c-middle__inner{flex:1 0 auto}
.c-actions{position:sticky;bottom:0;z-index:5;flex:0 0 auto;display:flex;flex-direction:column;gap:12px;padding:12px 24px;background:var(--surface-default);border-top:1px solid var(--border-muted)}
.c-actions__row{display:flex;align-items:center;gap:8px;min-height:40px}
.c-actions__done{display:inline-flex;align-items:center;gap:8px}
.c-actions__done svg{color:var(--surface-success-active)}
.c-alert--error{border-color:var(--border-error);background:var(--surface-error-rest)}
.c-alert--error svg{color:var(--surface-error-active)}
.c-status.is-ok .c-status__dot{background:var(--surface-success-active)}
/* variant B: project setting at the bottom of Kostnader */
.c-projset{display:flex;flex-direction:column;gap:4px;padding-top:16px;border-top:1px solid var(--border-muted)}
.c-projset__row{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;line-height:1.4;cursor:pointer}
.c-projset__help{margin:0 0 0 26px;font-size:12px;line-height:1.4;color:var(--text-muted)}
/* ---------------- variant C: one cost table, order lines nested under their cost ---------------- */
.c-ctable{min-width:var(--minw)}
/* in a narrow column (attachment open on a laptop) the description gets less room, so account and VAT stay in view */
.c-costs__body.is-c{container-type:inline-size}
@container (max-width:759px){
  .c-ctable.is-open{min-width:var(--minw-n)}
  .c-ctable col.c-col-narrow{width:var(--w-n)!important}
}
.c-ctable.is-compact th.c-th-sel{padding:0 0 0 12px}
.c-ctable.is-compact th.c-th-act{padding:0}
/* copy of the table's scrollbar, kept in view above the «Bokfør» bar while the table is on screen */
.c-tscroll{min-width:0}
.c-hbar{display:none}
.c-tscroll.has-hbar .c-hbar{display:block;position:sticky;bottom:var(--act-h,0px);z-index:4;overflow-x:scroll;overflow-y:hidden;background:var(--surface-default)}
.c-hbar>div{height:1px}
.c-tscroll.has-hbar .c-tablewrap{scrollbar-width:none}
.c-tscroll.has-hbar .c-tablewrap::-webkit-scrollbar{display:none}
/* a line waiting to be regrouped: the fields that differ from its cost get a dot */
.c-ctable td.is-changed .c-cf__val::before{content:"";display:inline-block;width:8px;height:8px;margin:0 4px 2px 0;border-radius:var(--radius-full);background:var(--surface-info-active);vertical-align:middle}
/* row actions in the cost table are 32px, like the compact fields next to them */
.c-ctable .c-iconbtn{width:32px;height:32px}
.c-dot{flex:0 0 auto;display:inline-block;width:8px;height:8px;border-radius:var(--radius-full);background:var(--surface-info-active)}
/* the open table sets the costs apart from their order lines; the collapsed table is a plain list of costs */
.c-ctable.is-open .c-cg td{background:var(--surface-info-rest)}
.c-ctable.is-open .c-cg input,.c-ctable.is-open .c-cg .c-cf__val,.c-ctable.is-open .c-cg__amt{font-weight:500}
.c-ctable td.r{text-align:right}
/* collapsed table: tighter cells, so four columns fit next to the attachment */
.c-ctable.is-compact th{padding:0 16px}
.c-ctable.is-compact .c-cf{padding:0 10px}
.c-ctable.is-compact .c-cf--select{padding:0 6px 0 10px;gap:4px}
.c-ctable.is-compact .c-cf--amount{padding:0 10px 0 6px}
.c-ctable.is-compact .c-cg__amt{padding-right:16px!important}
.c-cg__amt{padding-right:22px!important}
.c-cg__desc{display:flex;align-items:center;gap:8px;min-width:0}
.c-cg__desc .c-cf{flex:1 1 auto;min-width:0}
.c-ctable .c-stk0,.c-ctable .c-stk1{position:sticky;z-index:2}
.c-ctable .c-stk0{left:0}
.c-ctable .c-stk1{left:40px}
.c-ctable th.c-stk0,.c-ctable th.c-stk1{z-index:3}
.c-tablewrap.is-scrolled .c-stk-edge{box-shadow:0 0 10px 0 var(--overflow-shadow);clip-path:inset(0 -12px 0 0)}
.c-cg__chev{flex:0 0 24px;width:24px;height:24px;display:grid;place-items:center;border-radius:var(--radius);color:var(--text-primary)}
.c-cg__chev:hover{background:var(--action-tertiary-hover)}
/* number of order lines in a cost: a chip, with a dot while some of them wait for «Omgrupper linjer» */
.c-cgn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:24px;height:24px;padding:0 8px;border-radius:var(--radius-full);background:var(--surface-info-highlight);font-size:12px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-ctable .c-cg.is-new td{animation:c-flash-row 1.6s ease-out}
.c-ctable:not(.is-open) .c-cg.is-new td{animation-name:c-flash-plain}
@keyframes c-flash-row{0%{background:var(--surface-info-highlight)}100%{background:var(--surface-info-rest)}}
@keyframes c-flash-plain{0%{background:var(--surface-info-highlight)}100%{background:var(--surface-default)}}
/* order lines: the hierarchy is shown by indent only; their text starts 24px further in than the cost's */
.c-tree{display:flex;align-items:center;gap:8px;padding-left:56px;min-width:0}
.c-tree .c-cf{flex:1 1 auto;min-width:0}
.c-cl__via{padding-left:10px;color:var(--text-muted);white-space:nowrap}
.c-cl__via.is-on{color:var(--text-primary)}
/* «Omgrupper linjer» sits at the far right of the filter line, which stays in view while the table scrolls */
.c-rgbtn{margin-left:auto}
.c-costs__body.is-c #linesBar{position:sticky;top:0;z-index:4}
.c-cf--pct{flex:0 0 72px;width:72px}
.c-rebill .c-cf--select{flex:1 1 auto;justify-content:space-between;padding:0 10px 0 16px}
.c-rbsum{margin:0;padding-block:12px;border-top:1px solid var(--border-muted);color:var(--text-muted);line-height:1.4;display:flex;flex-direction:column;gap:4px}
.c-rbsum p{margin:0}
.c-rbsum b{color:var(--text-primary);font-weight:500}
.c-cf.is-error,.c-cf.is-error:hover,tbody tr:hover .c-cf.is-error,tbody tr:focus-within .c-cf.is-error:not(:focus-visible){border-color:var(--border-error)}
.c-stack[inert] .c-field,.c-stack[inert] .c-cf{background:var(--surface-disabled);border-color:var(--border-muted)}
.c-stack[inert] .c-cost__actions,.c-stack[inert] .c-foot>.c-btn,.c-stack[inert] .c-rowacts{visibility:hidden}

/* ---------------- electricity invoice paper ---------------- */
.c-paper--el .c-inv__top{align-items:center}
.c-el__brand{display:flex;align-items:center;gap:8px}
.c-el__brand div{display:flex;flex-direction:column;gap:1px}
.c-el__brand b{font-size:14px;line-height:1.2;font-weight:500;color:var(--el-brand)}
.c-el__brand span{color:var(--paper-muted)}
.c-el__logo{flex:0 0 auto}
.c-el__logo-bg{fill:var(--el-brand)}
.c-el__logo-fg{fill:var(--el-accent)}
.c-el__mid{margin-top:18px}
.c-el__sub{display:block;margin-top:2px;color:var(--paper-muted)}
.c-el__pay{display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.3fr;gap:12px;margin-top:14px;padding:8px 12px;background:var(--el-tint);border-left:3px solid var(--el-brand)}
.c-el__pay div{display:flex;flex-direction:column;gap:2px;min-width:0}
.c-el__pay span{color:var(--paper-muted)}
.c-el__pay b{font-size:11px;font-weight:500;white-space:nowrap}
.c-el__info{display:grid;grid-template-columns:1fr 232px;gap:24px;margin-top:14px}
.c-el__info h4{font-size:9px;font-weight:500;margin:0 0 6px}
.c-el__site dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.c-el__site dt{color:var(--paper-muted)}
.c-el__site dd{margin:0}
.c-el__svg{display:block}
.c-el__grid{stroke:var(--paper-rule);stroke-width:.6}
.c-el__tick{fill:var(--paper-muted);font-size:6.5px}
.c-el__bar{fill:var(--el-bar)}
.c-el__bar.is-now{fill:var(--el-brand)}
.c-el__val{fill:var(--paper-ink);font-size:6.5px;font-weight:500}
.c-el__lines{margin-top:14px}
.c-el__sec td{font-weight:500;padding-top:5px;border-bottom:1px solid var(--paper-rule-strong)}
.c-el__note{margin:6px 0 0;color:var(--paper-muted)}
.c-paper--el{padding:36px 46px 28px}
.c-paper--el .c-inv__meta{gap:8px}
.c-paper--el .c-inv__lines td{padding:2.5px 0}
.c-paper--el .c-inv__lines td:nth-child(3),.c-paper--el .c-inv__lines th:nth-child(3){padding-left:8px}
.c-paper--el .c-inv__sum{margin-top:10px}

@media (max-width:1279px){.c-search{width:240px}}
@media (max-width:1023px){
  .c-side{position:fixed;left:0;top:calc(var(--demo-h) + var(--top-h));bottom:0;z-index:60;transform:translateX(-100%);transition:transform .2s ease;flex-basis:auto;width:var(--side-w)}
  .c-app.is-side-open .c-side{transform:none}
  .c-app.is-side-open .c-side-scrim{display:block;position:fixed;inset:calc(var(--demo-h) + var(--top-h)) 0 0 0;background:var(--surface-scrim);z-index:55}
  .c-app.is-side-mini .c-side{width:var(--side-w)}
  .c-app.is-side-mini .c-side__label{display:inline}
  .c-pdf{position:fixed;right:0;top:calc(var(--demo-h) + var(--top-h));bottom:0;width:min(560px,calc(100vw - 40px));z-index:50}
  .c-app.is-pdf-closed .c-pdf{width:40px;pointer-events:none}
  .c-app.is-pdf-closed .c-tabhandle--show{pointer-events:auto}
  .c-middle__inner{padding-right:56px}
}
@media (max-width:767px){
  .c-search{display:none}
  .c-search__btn{display:grid}
  .c-topbar__right{gap:16px}
  .c-middle__inner{padding:8px 16px 32px;padding-right:48px}
  .c-pad{padding-inline:16px}
  .c-divider{margin-inline:16px}
  .c-details{padding:16px}
  .c-pay{padding:20px 16px}
  .c-pay__row{grid-template-columns:minmax(0,1fr)}
  .c-pay__row .c-ig__label.r{text-align:left}
  .c-foot{flex-direction:column;align-items:stretch}
  .c-totals{width:100%}
  .c-ph__title h1{font-size:24px}
  .c-tf__search{flex:1 1 160px;width:auto}
  .c-toasts{right:16px;left:16px;align-items:stretch}
}
@media (max-width:767px){.c-demo{gap:8px}.c-demo__name,.c-demo__hint{display:none}.c-actions{padding:12px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

  function regroupCore() {
    var moved = pendingLines(); if (!moved.length) return null;

    var taken = new Set(groups.map(function (g) { return g.desc; }));

    moved.forEach(function (l) {

    $$('.c-pagebox', sc).forEach(function (b) {

      var t = pages[a === 'next' ? Math.min(pages.length - 1, idx + 1) : Math.max(0, idx - 1)];

        if (l.rebill && !l.markup) l.markup = '10';
        render({ focus: 'l' + l.id + '-rebill' }); markSaved(); return;
      }
      l.rebill = el.checked;
      if (l.rebill && l.markup === '') l.markup = '10';
      var tr = el.closest('tr'), mk = tr && tr.querySelector('[data-field="markup"]');
      if (mk) { mk.disabled = !l.rebill; mk.value = l.markup; mk.closest('.c-cf').classList.toggle('is-disabled', !l.rebill); }
      markSaved(); return;
    }
    if (el.id === 'projLines') { S.projLines = el.checked; $('#projLinesHelp').textContent = projConsequence(); markSaved(); return; }
    if (el.name === 'payto') { $('#lblPayAcct').textContent = el.value === 'ut' ? 'IBAN' : 'IBAN/kontonummer'; markSaved(); return; }
    if (el.dataset && el.dataset.field && el.dataset.scope) { commitInput(el); if (el.dataset.field === 'desc') markSaved(); return; }
    if (el.closest && el.closest('#payForm')) markSaved();
  });

  function focusNext(el) {
    var all = $$('#costBody [data-fk]').filter(function (x) {
      if (x.disabled || !x.offsetParent) return false;
      if (x.tagName === 'INPUT') return x.type === 'text' && !x.readOnly;
      return !!x.dataset.pop;
    });
    var i = all.indexOf(el), nx = all[i + 1];
    if (nx) nx.focus(); else el.blur();
  }

  document.addEventListener('keydown', function (e) {
    var el = e.target;
    if (P && pop.contains(el)) {
      if (P.type === 'pick') {
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(P.active + 1); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); setActive(P.active - 1); return; }
        if (e.key === 'Home') { e.preventDefault(); setActive(0); return; }
        if (e.key === 'End') { e.preventDefault(); setActive(P.view.length - 1); return; }
        if (e.key === 'Enter') { e.preventDefault(); choose(P.active); return; }
      }
      if (e.key === 'Escape') { e.preventDefault(); closePop(true); return; }
      if (e.key === 'Tab' && P.type === 'pick') { closePop(true); return; }
      return;
    }
    if (!M && LD.open && e.key === 'Tab') {
      var fl = $$('#linesDlg button, #linesDlg input').filter(function (x) { return !x.disabled && x.offsetParent; });
      if (fl.length) {
        if (e.shiftKey && document.activeElement === fl[0]) { e.preventDefault(); fl[fl.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === fl[fl.length - 1]) { e.preventDefault(); fl[0].focus(); }
      }
    }
    if (M && e.key === 'Tab') {
      var f = $$('#modal button, #modal input').filter(function (x) { return !x.disabled && x.offsetParent; });
      if (f.length) {
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    }
    if (e.key === 'Escape') {
      if (P) { closePop(true); return; }
      if (M) { closeModal(); return; }
      if (S.sel.size && linesVisible()) { S.sel.clear(); renderBar(); renderRows(); focusFk('filter'); return; }
      if (LD.open) { closeLines(); return; }
      if (L.sideOpen) { L.sideOpen = false; applyLayout(); return; }
    }
    if (el.classList && el.classList.contains('c-tab') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault(); setTab(S.tab === 'grouped' ? 'lines' : 'grouped'); return;
    }
    if (e.key === 'ArrowDown' && el.dataset && el.dataset.pop) {
      e.preventDefault(); openPicker(el); return;
    }
    if (e.key === 'Enter' && el.tagName === 'INPUT' && el.type === 'text' && el.dataset && el.dataset.field && el.closest('#costBody')) {
      e.preventDefault(); commitInput(el); focusNext(el);
    }
  });

  document.addEventListener('pointerdown', function (e) {
    if (!P) return;
    if (pop.contains(e.target) || P.trigger.contains(e.target)) return;
    closePop(false);
  }, true);
  document.addEventListener('scroll', function (e) {
    var t = e.target;
    if (t && t.id === 'tablewrap') {
      t.classList.toggle('is-scrolled', t.scrollLeft > 0);
      var hb = $('#hbar'); if (hb && Math.abs(hb.scrollLeft - t.scrollLeft) > 1) hb.scrollLeft = t.scrollLeft;
    } else if (t && t.id === 'hbar') {
      var tw = $('#tablewrap'); if (tw && Math.abs(tw.scrollLeft - t.scrollLeft) > 1) tw.scrollLeft = t.scrollLeft;
    }
    if (!P || pop.contains(e.target)) return;
    var r = P.trigger.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight) closePop(false);
    else placePop(P.trigger, P.type === 'menu' ? 300 : ((P.kind === 'account' || P.kind === 'vat') ? 420 : (P.kind === 'rbmode' || P.kind === 'toproj' ? 340 : 280)), P.trigger.id === 'colsBtn');
  }, true);
  window.addEventListener('resize', function () {
    applyLayout(); pdfLayout();
    if (P) placePop(P.trigger, P.type === 'menu' ? 300 : ((P.kind === 'account' || P.kind === 'vat') ? 420 : (P.kind === 'rbmode' || P.kind === 'toproj' ? 340 : 280)), P.trigger.id === 'colsBtn');
  });
  /* Re-fit the attachment when its panel changes size. The work waits for the next frame and only runs when
     the size really changed, so resizing the pages can never feed back into the observer
     («ResizeObserver loop completed with undelivered notifications»). */
  var roQueued = false;
  function pdfAutoLayout() {
    roQueued = false;
    var sc = $('#pdfScroll'); if (!sc || PDF.mode === 'custom') return;
    if (sc.clientWidth + 'x' + sc.clientHeight !== PDF.box) pdfLayout();
  }
  if (window.ResizeObserver) new ResizeObserver(function () { if (!roQueued) { roQueued = true; requestAnimationFrame(pdfAutoLayout); } }).observe($('#pdfScroll'));
  /* the copy scrollbar under the cost table follows the table's width and the height of the «Bokfør» bar, the same way */
  var hbQueued = false;
  if (window.ResizeObserver) {
    var hbRO = new ResizeObserver(function () { if (!hbQueued) { hbQueued = true; requestAnimationFrame(function () { hbQueued = false; syncHbar(); }); } });
    hbRO.observe($('#costBody')); hbRO.observe($('#actions'));
  }

  /* cost descriptions: the first click selects the whole text, so typing replaces it */
  var selectOnFocus = null;
  document.addEventListener('focusin', function (e) {
    var el = e.target;
    if (el.tagName === 'INPUT' && el.dataset.field === 'desc' && (el.dataset.scope === 'group' || el.dataset.scope === 'manual' || el.dataset.scope === 'cgroup')) { el.select(); selectOnFocus = el; }
  });
  document.addEventListener('mouseup', function (e) {
    if (selectOnFocus && e.target === selectOnFocus) e.preventDefault();   /* keep the selection the click would collapse */
    selectOnFocus = null;
  });

  /* ---------- boot ---------- */
  payHTML = $('#pay').innerHTML;
  var hm = /^#(?:variant-)?([abc])$/i.exec(location.hash); if (hm) DESIGN = hm[1].toUpperCase();
  applyLayout();
  openInvoice(INVOICES[0].id);
  window.__proto = { get S() { return S; }, get INV() { return INV; }, get DESIGN() { return DESIGN; }, design: switchDesign, getGroups: getGroups, totals: totals, restart: restart, post: post, open: openInvoice };
})();
